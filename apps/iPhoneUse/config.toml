[github]
repo = "aierlma/AltGallery"

[source]
name = "iPhoneUse Runner"
subtitle = "iPhoneUse Runner SideStore compatibility build"
description = "SideStore compatibility packages for the upstream iPhoneUse runner. Version 0.17.19 build 3 has been tested on a real iPhone, including SideStore refresh and wireless control. New upstream releases are automatically built and checked before being added to this source."
icon_url = "https://raw.githubusercontent.com/aierlma/AltGallery/refs/heads/master/apps/iPhoneUse/icon.png"
website = "https://github.com/leeguooooo/iphone-use"
tint_color = "#2563EB"

[app]
name = "iPhoneUse Runner"
# Read back from the packaged IPA; upstream's generic runner identifier.
bundle_identifier = "com.leeguoo.iphone-use.runner.xctrunner"
developer_name = "leeguooooo / aierlma packaging"
subtitle = "SideStore 续签 · Agent 按需启动"
description = "让 Agent 读取和操作真实 iPhone 的 Runner，由 SideStore 安装和续签。需要开发者模式及一台配置了 iPhoneUse 和 Xcode 的 Mac；完成配对后可通过同一网络无线使用。由 Agent 按任务需要启动，点开手机图标不会自行开始控制。0.17.19 build 3 已实测安装、续签及无线读屏；后续上游版本会自动构建并校验，再进入此订阅源，但仍需单独确认设备兼容性。这是社区兼容包，并非上游官方发行包。"
icon_url = "https://raw.githubusercontent.com/aierlma/AltGallery/refs/heads/master/apps/iPhoneUse/icon.png"
screenshots = []
tint_color = "#2563EB"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
# Include only explicitly labelled compatibility candidates, not upstream assets.
include_prereleases = true
max_versions = 1
asset_pattern = '^iPhoneUse-Runner-\d+\.\d+\.\d+-SideStore-b\d+\.ipa$'
version_source = "filename"
version_pattern = '(\d+\.\d+\.\d+)'
build_version_pattern = '-b(\d+)\.ipa$'

[news]
title_template = "{name} {version} · compatibility candidate"
caption_template = "SideStore compatibility candidate; device validation pending."
image_url = "https://raw.githubusercontent.com/aierlma/AltGallery/refs/heads/master/apps/iPhoneUse/images/news.png"

[output]
path = "apps.json"
