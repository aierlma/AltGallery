# render_news.py config: python3 templates/render_news.py --out apps/Aidoku
# Colors left unset are auto-derived: tint from config.toml, background as
# a light shade of the icon's dominant color.

name = "Aidoku"
tagline = "Free and open source manga reader for iOS and iPadOS"

# Optional — unset colors are auto-derived:
# [colors]
# tint = "#FF375F"             badge/glow accent (default: [app] tint_color)
# tint_alt = "#FF375F"         secondary accent (default: [source] tint_color)
# background = "#D6EBDD"       background base (default: from icon color)
# bg_mid = "#151E33"           lighter mid stop (default: derived from background)
# bg_dark = "#0D1220"          darker end stop (default: derived from background)
# text_color = "#111111"       app name color (default: auto white/black)
# tagline_color = "#AABDD6"    subtitle color (default: derived from background)
