<?xml version="1.0" encoding="UTF-8"?>
<!--
  AltGallery news update promo template
  Canvas: 1600 x 1200 (4:3) — two columns:
    left:  app icon with NEW UPDATE badge below it
    right: app name + one-line tagline
  Type and icon are intentionally large so the image stays readable when
  AltStore shows it at thumbnail size.

  Placeholders (replace with `render_news.py`, or by hand):
    {{APP_NAME}}        app display name, e.g. "PiliPlus"
    {{TAGLINE}}         short one-line descriptor, e.g. "BiliBili 第三方客户端"
    {{ICON}}            icon image path, relative to this SVG
    {{TINT}}            brand accent color (app tint_color from config.toml), e.g. "#73b480"
    {{TINT_ALT}}        secondary accent color (source tint_color from config.toml), e.g. "#00AEEF"

  Note: no version number and no links on purpose — this image is referenced
  by news entries across releases, it only advertises "NEW UPDATE".

  Render to PNG:
    rsvg-convert -o news.png news.svg        (or: qlmanage -t -s 1600 -o . news.svg)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C111D"/>
      <stop offset="0.55" stop-color="#151E33"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>

    <radialGradient id="glowTint" cx="0.30" cy="0.42" r="0.75">
      <stop offset="0" stop-color="{{TINT}}" stop-opacity="0.30"/>
      <stop offset="1" stop-color="{{TINT}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAlt" cx="0.78" cy="0.85" r="0.8">
      <stop offset="0" stop-color="{{TINT_ALT}}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="{{TINT_ALT}}" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clipIcon"><rect x="270" y="240" width="420" height="420" rx="104"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1600" height="1200" fill="url(#bgGrad)"/>
  <rect width="1600" height="1200" fill="url(#glowTint)"/>
  <rect width="1600" height="1200" fill="url(#glowAlt)"/>
  <circle cx="1600" cy="0" r="300" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="0" cy="1200" r="340" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>

  <!-- left column: icon -->
  <image x="270" y="240" width="420" height="420" href="{{ICON}}" clip-path="url(#clipIcon)" preserveAspectRatio="xMidYMid slice"/>
  <rect x="270" y="240" width="420" height="420" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4"/>

  <!-- left column: NEW UPDATE badge -->
  <rect x="260" y="740" width="440" height="92" rx="46"
        fill="{{TINT}}" fill-opacity="0.18" stroke="{{TINT}}" stroke-opacity="0.6" stroke-width="3"/>
  <text x="480" y="802" font-family="'Helvetica Neue','Hiragino Sans GB','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"
        font-size="44" font-weight="800" letter-spacing="6" fill="{{TINT}}" text-anchor="middle">NEW UPDATE</text>

  <!-- right column: app name -->
  <text x="830" y="540" font-family="'Helvetica Neue','Hiragino Sans GB','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"
        font-size="140" font-weight="800" letter-spacing="1" fill="#FFFFFF" text-anchor="start">{{APP_NAME}}</text>

  <!-- right column: tagline -->
  <text x="830" y="625" font-family="'Helvetica Neue','Hiragino Sans GB','PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif"
        font-size="48" font-weight="600" fill="#AABDD6" text-anchor="start">{{TAGLINE}}</text>
</svg>
